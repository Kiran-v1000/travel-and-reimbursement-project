# nginx site for Voyage (Linux). Serves the built React app and proxies /api to the
# Node cluster. Put the TLS certificate paths for your host below.
#
# /etc/nginx/sites-available/voyage  ->  ln -s into sites-enabled, then: nginx -t && systemctl reload nginx

upstream voyage_api {
    # pm2 cluster workers share port 4010; add more hosts here to scale out.
    server 127.0.0.1:4010;
    keepalive 64;
    keepalive_timeout 60s;   # must stay below the API's keepAliveTimeout (65 s)
}

server {
    listen 80;
    server_name travel.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name travel.example.com;

    ssl_certificate     /etc/ssl/certs/voyage.crt;
    ssl_certificate_key /etc/ssl/private/voyage.key;

    root /opt/voyage/client/dist;
    index index.html;

    client_max_body_size 12m;      # receipts are capped at 10 MB by the API
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed build assets can be cached for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://voyage_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;     # first company-wide analytics can take a while
    }

    # SPA routing
    location / {
        try_files $uri /index.html;
    }
}
